# The invoices API on a Fly Machine.
#
#   fly launch --copy-config --no-deploy
#   fly secrets set ANCHOR_API_KEY=... SITE_URL=... HEAL_URL=... HEAL_TOKEN=... API_TOKEN=...
#   fly deploy
#
# It keeps the last good result in memory and refreshes it on a timer, so one
# Machine stays up.

app = "hangar-invoices-api"
primary_region = "ord"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

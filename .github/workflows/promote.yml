# Merging a heal PR is what puts the fix into production: publish the draft the
# PR reviewed, then redeploy the API so it runs the task the spec points at.
name: promote

on:
  push:
    branches: [main]
    paths: ['tasks/**']

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run promote
        env:
          ANCHOR_API_KEY: ${{ secrets.ANCHOR_API_KEY }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}
      - run: flyctl deploy --remote-only
        if: ${{ env.FLY_API_TOKEN != '' }}
